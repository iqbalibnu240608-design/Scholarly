<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="100%" height="100%">
  <defs>
    <!-- Gradients for 3D Clay effect -->
    <linearGradient id="charSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="60%" stop-color="#FCD5C3"/>
      <stop offset="100%" stop-color="#F5BCA5"/>
    </linearGradient>
    <linearGradient id="charShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="charPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="charShoe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="charCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="60%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="deskShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="210" cy="285" rx="150" ry="14" fill="url(#deskShadow)"/>
  <ellipse cx="65" cy="275" rx="20" ry="6" fill="url(#deskShadow)"/>

  <!-- ================= 1. DESK & LEGS ================= -->
  <!-- Back Legs -->
  <rect x="90" y="220" width="8" height="55" rx="4" fill="#0284C7"/>
  <rect x="330" y="220" width="8" height="55" rx="4" fill="#0284C7"/>

  <!-- Front Legs -->
  <rect x="80" y="220" width="10" height="60" rx="5" fill="#0369A1"/>
  <rect x="340" y="220" width="10" height="60" rx="5" fill="#0369A1"/>
  <rect x="75" y="276" width="20" height="6" rx="3" fill="#0369A1"/>
  <rect x="335" y="276" width="20" height="6" rx="3" fill="#0369A1"/>

  <!-- Desk Surface (Thick 3D Chamfer) -->
  <rect x="70" y="215" width="290" height="12" rx="6" fill="url(#deskGrad)"/>
  <rect x="70" y="222" width="290" height="4" fill="#075985" fill-opacity="0.6"/>

  <!-- ================= 2. DESK CHAIR ================= -->
  <!-- Chair Pole & Wheels -->
  <rect x="207" y="235" width="6" height="40" rx="3" fill="#64748B"/>
  <line x1="185" y1="272" x2="235" y2="272" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <circle cx="185" cy="274" r="3" fill="#334155"/>
  <circle cx="210" cy="274" r="3" fill="#334155"/>
  <circle cx="235" cy="274" r="3" fill="#334155"/>
  <!-- Chair Cushion -->
  <ellipse cx="210" cy="235" rx="28" ry="10" fill="#E2E8F0"/>

  <!-- ================= 3. 3D CHARACTER ================= -->
  <g id="Character">
    <!-- Legs & Shoes (Dangling happily) -->
    <!-- Left Leg -->
    <path d="M194 235 L178 262" stroke="url(#charPants)" stroke-width="18" stroke-linecap="round"/>
    <!-- Left Shoe -->
    <g transform="translate(162, 255) rotate(-18)">
      <rect width="28" height="14" rx="7" fill="url(#charShoe)"/>
      <rect x="4" y="11" width="22" height="4" rx="2" fill="#2563EB"/>
      <path d="M10 4 L14 8 M16 4 L20 8" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Right Leg -->
    <path d="M226 235 L242 262" stroke="url(#charPants)" stroke-width="18" stroke-linecap="round"/>
    <!-- Right Shoe -->
    <g transform="translate(242, 258) rotate(22)">
      <rect width="28" height="14" rx="7" fill="url(#charShoe)"/>
      <rect x="4" y="11" width="22" height="4" rx="2" fill="#2563EB"/>
      <path d="M10 4 L14 8 M16 4 L20 8" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Body (Chubby white sweatshirt) -->
    <ellipse cx="210" cy="210" rx="34" ry="30" fill="url(#charShirt)"/>

    <!-- Left Arm (Resting on desk) -->
    <path d="M180 200 Q170 216 195 218" stroke="url(#charShirt)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="198" cy="218" r="7" fill="url(#charSkin)"/>

    <!-- Right Arm (Raised in Peace/Wave sign!) -->
    <path d="M236 198 Q260 180 256 150" stroke="url(#charShirt)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <!-- Hand with Peace Sign ✌️ -->
    <circle cx="256" cy="144" r="8" fill="url(#charSkin)"/>
    <rect x="250" y="130" width="5" height="16" rx="2.5" fill="url(#charSkin)"/>
    <rect x="257" y="132" width="5" height="15" rx="2.5" fill="url(#charSkin)"/>

    <!-- Head -->
    <circle cx="210" cy="168" r="26" fill="url(#charSkin)"/>
    <!-- Hair fringe -->
    <path d="M188 158 Q210 148 232 158 Q226 166 218 162 Q210 166 202 162 Q194 166 188 158 Z" fill="#1E293B"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="194" cy="174" rx="4.5" ry="3" fill="#FDA4AF" fill-opacity="0.8"/>
    <ellipse cx="226" cy="174" rx="4.5" ry="3" fill="#FDA4AF" fill-opacity="0.8"/>
    <!-- Cute Eyes -->
    <circle cx="199" cy="168" r="2.8" fill="#0F172A"/>
    <circle cx="221" cy="168" r="2.8" fill="#0F172A"/>
    <!-- Cute Smile -->
    <path d="M206 176 Q210 181 214 176" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Stylish Hat / Scholar Beret -->
    <g transform="translate(210, 146)">
      <!-- Hat Rim -->
      <ellipse cx="0" cy="0" rx="34" ry="8" fill="url(#charCap)"/>
      <!-- Hat Crown -->
      <path d="M-18 0 C-18 -16 18 -16 18 0 Z" fill="#C2410C"/>
      <circle cx="0" cy="-14" r="3" fill="#EA580C"/>
    </g>
  </g>

  <!-- ================= 4. DESK ACCESSORIES ================= -->
  <!-- Large PC Monitor on Left -->
  <g id="PCMonitor" transform="translate(86, 172)">
    <!-- Stand -->
    <rect x="36" y="38" width="14" height="22" rx="3" fill="#CBD5E1"/>
    <path d="M28 58 L58 58" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <!-- Monitor Body -->
    <rect width="66" height="42" rx="6" fill="url(#screenGrad)"/>
    <rect x="3" y="3" width="60" height="36" rx="3" fill="#0F172A"/>
    <!-- Screen Sparks (Idea / Glow) -->
    <path d="M20 18 L24 24 L28 14 L34 22" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sticky note on monitor -->
    <rect x="44" y="22" width="10" height="10" rx="1.5" fill="#FEF08A"/>
    <!-- Idea rays above monitor -->
    <line x1="26" y1="-8" x2="26" y2="-2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="-6" x2="19" y2="-1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="-6" x2="33" y2="-1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Laptop on Right -->
  <g id="Laptop" transform="translate(280, 185)">
    <!-- Base -->
    <polygon points="4,28 48,28 44,34 8,34" fill="#9D174D"/>
    <!-- Screen -->
    <rect x="12" y="8" width="34" height="22" rx="3" fill="url(#laptopGrad)"/>
    <rect x="14" y="10" width="30" height="18" rx="2" fill="#BE185D"/>
    <!-- School logo on laptop -->
    <circle cx="29" cy="19" r="3.5" fill="#FCE7F3"/>
  </g>

  <!-- Potted Plant on Floor (Left) -->
  <g id="FloorPlant" transform="translate(56, 240)">
    <!-- Ceramic Pot -->
    <path d="M6 24 L8 38 C8 41 20 41 20 38 L22 24 Z" fill="#E11D48"/>
    <ellipse cx="14" cy="24" rx="8" ry="2.5" fill="#BE123C"/>
    <!-- Soil -->
    <ellipse cx="14" cy="24" rx="6.5" ry="2" fill="#78350F"/>
    <!-- Lush Plant Foliage -->
    <ellipse cx="14" cy="14" rx="8" ry="12" fill="url(#plantGrad)"/>
    <ellipse cx="14" cy="6" rx="6" ry="8" fill="#86EFAC"/>
  </g>
</svg>
