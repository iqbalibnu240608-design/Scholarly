<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" style="background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#356DF3"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#356DF3"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#356DF3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#356DF3" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="novusAura1" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F5F3FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="novusAura2" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#EFF6FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tabletBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="isoBlockBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

  </defs>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#356DF3" letter-spacing="1">STEELSCHOOL DESIGN SYSTEM</text>
    <text x="0" y="36" font-size="34" font-weight="800" fill="#0F172A">Color Palette, Typography &amp; Components</text>
    <text x="0" y="64" font-size="15" font-weight="400" fill="#64748B">
      Token desain acuan harmonis yang menyatukan Novus, Flowize AI, dan NexaAdmin ke dalam ekosistem SteelSchool.
    </text>
  </g>

  <!-- Color Palette Row -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">1. Semantic Color Tokens</text>

    <g transform="translate(0, 20)">
      <!-- Swatch 1: Primary Blue -->
      <g transform="translate(0, 0)">
        <rect width="180" height="90" rx="14" fill="#356DF3"/>
        <text x="14" y="116" font-size="13" font-weight="700" fill="#0F172A">Primary Blue</text>
        <text x="14" y="134" font-size="12" font-weight="500" fill="#64748B">#356DF3</text>
      </g>
      <!-- Swatch 2: Deep Indigo -->
      <g transform="translate(210, 0)">
        <rect width="180" height="90" rx="14" fill="#4F46E5"/>
        <text x="14" y="116" font-size="13" font-weight="700" fill="#0F172A">Deep Indigo</text>
        <text x="14" y="134" font-size="12" font-weight="500" fill="#64748B">#4F46E5</text>
      </g>
      <!-- Swatch 3: Soft Lavender -->
      <g transform="translate(420, 0)">
        <rect width="180" height="90" rx="14" fill="#EEF0FF" stroke="#C7D2FE" stroke-width="1"/>
        <text x="14" y="116" font-size="13" font-weight="700" fill="#0F172A">Soft Lavender</text>
        <text x="14" y="134" font-size="12" font-weight="500" fill="#64748B">#EEF0FF</text>
      </g>
      <!-- Swatch 4: Success Emerald -->
      <g transform="translate(630, 0)">
        <rect width="180" height="90" rx="14" fill="#10B981"/>
        <text x="14" y="116" font-size="13" font-weight="700" fill="#0F172A">Success Emerald</text>
        <text x="14" y="134" font-size="12" font-weight="500" fill="#64748B">#10B981</text>
      </g>
      <!-- Swatch 5: Slate 900 Text -->
      <g transform="translate(840, 0)">
        <rect width="180" height="90" rx="14" fill="#0F172A"/>
        <text x="14" y="116" font-size="13" font-weight="700" fill="#0F172A">Dark Text / Dark Navy</text>
        <text x="14" y="134" font-size="12" font-weight="500" fill="#64748B">#0F172A</text>
      </g>
      <!-- Swatch 6: Surface Neutral -->
      <g transform="translate(1050, 0)">
        <rect width="180" height="90" rx="14" fill="#F7F8FC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="14" y="116" font-size="13" font-weight="700" fill="#0F172A">Surface Background</text>
        <text x="14" y="134" font-size="12" font-weight="500" fill="#64748B">#F7F8FC</text>
      </g>
    </g>
  </g>

  <!-- Typography & Components Row -->
  <g transform="translate(80, 360)">
    <!-- Left: Typography Scale -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">2. Typography Scale</text>

      <g transform="translate(0, 30)">
        <text x="0" y="40" font-size="52" font-weight="800" fill="#0F172A">Display 52px Bold</text>
        <text x="0" y="80" font-size="34" font-weight="800" fill="#0F172A">Heading 1 (34px)</text>
        <text x="0" y="118" font-size="24" font-weight="700" fill="#0F172A">Heading 2 (24px)</text>
        <text x="0" y="150" font-size="16" font-weight="600" fill="#1E293B">Body Large / Subheading (16px)</text>
        <text x="0" y="180" font-size="14" font-weight="400" fill="#475569">Body Regular Text (14px) - Clean, accessible contrast ratio.</text>
        <text x="0" y="206" font-size="12" font-weight="500" fill="#64748B">Caption &amp; Badge Text (12px)</text>
      </g>
    </g>

    <!-- Right: UI Components (Buttons & Badges) -->
    <g transform="translate(680, 0)">
      <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">3. UI Component Library</text>

      <!-- Buttons -->
      <g transform="translate(0, 30)">
        <!-- Primary Pill -->
        <rect width="180" height="46" rx="23" fill="url(#primaryGrad)"/>
        <text x="90" y="28" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Primary Button</text>

        <!-- Secondary Play Pill -->
        <g transform="translate(200, 0)">
          <rect width="190" height="46" rx="23" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
          <circle cx="24" cy="23" r="15" fill="#EFF6FF"/>
          <polygon points="22,18 28,23 22,28" fill="#356DF3"/>
          <text x="110" y="28" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">Watch Demo</text>
        </g>

        <!-- Outline Pill -->
        <g transform="translate(410, 0)">
          <rect width="160" height="46" rx="23" fill="#FFFFFF" stroke="#356DF3" stroke-width="1.5"/>
          <text x="80" y="28" font-size="14" font-weight="600" fill="#356DF3" text-anchor="middle">Outline Action</text>
        </g>
      </g>

      <!-- Badges -->
      <g transform="translate(0, 100)">
        <rect width="90" height="26" rx="13" fill="#ECFDF5"/>
        <text x="45" y="17" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">LUNAS</text>

        <g transform="translate(104, 0)">
          <rect width="90" height="26" rx="13" fill="#EFF6FF"/>
          <text x="45" y="17" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">DIPROSES</text>
        </g>

        <g transform="translate(208, 0)">
          <rect width="90" height="26" rx="13" fill="#FFFBEB"/>
          <text x="45" y="17" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">PENDING</text>
        </g>

        <g transform="translate(312, 0)">
          <rect width="90" height="26" rx="13" fill="#FEF2F2"/>
          <text x="45" y="17" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">BATAL</text>
        </g>
      </g>

      <!-- 3D Tactile Mini-Preview -->
      <g transform="translate(0, 150)">
        <text x="0" y="20" font-size="14" font-weight="700" fill="#0F172A">Novus 3D Tactile Tiles:</text>
        <g transform="translate(0, 35)">
          <rect x="0" y="4" width="60" height="46" rx="12" fill="#312E81"/>
          <rect width="60" height="46" rx="12" fill="url(#isoBlockBlue)"/>

          <g transform="translate(74, 0)">
            <rect x="0" y="4" width="60" height="46" rx="12" fill="#CBD5E1"/>
            <rect width="60" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
            <text x="30" y="32" font-size="20" font-weight="800" fill="#475569" text-anchor="middle">Aa</text>
          </g>

          <g transform="translate(148, 0)">
            <rect x="0" y="4" width="70" height="46" rx="12" fill="#CBD5E1"/>
            <rect width="70" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
            <circle cx="20" cy="18" r="4" fill="#EF4444"/>
            <circle cx="35" cy="18" r="4" fill="#3B82F6"/>
            <circle cx="50" cy="18" r="4" fill="#10B981"/>
            <circle cx="20" cy="30" r="4" fill="#F59E0B"/>
            <circle cx="35" cy="30" r="4" fill="#6366F1"/>
            <circle cx="50" cy="30" r="4" fill="#8B5CF6"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>