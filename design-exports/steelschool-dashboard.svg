            <text x="20" y="48" font-size="12" font-weight="500" fill="#64748B">07:30 - 09:30 • Lab Komputer 1 • Budi Santoso, S.Pd</text>
            <rect x="520" y="20" width="84" height="26" rx="13" fill="#ECFDF5"/>
            <text x="562" y="37" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">SELESAI</text>
          </g>

          <!-- Item 2 -->
          <g transform="translate(0, 80)">
            <rect width="622" height="68" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <rect width="4" height="68" rx="2" fill="#10B981"/>
            <text x="20" y="28" font-size="14" font-weight="700" fill="#0F172A">Basis Data Relasional &amp; MySQL</text>
            <text x="20" y="48" font-size="12" font-weight="500" fill="#64748B">10:00 - 12:00 • Ruang Teori RPL • Siti Aminah, M.Kom</text>
            <rect x="520" y="20" width="84" height="26" rx="13" fill="#EFF6FF"/>
            <text x="562" y="37" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">BERLANGSUNG</text>
          </g>

          <!-- Item 3 -->
          <g transform="translate(0, 160)">
            <rect width="622" height="68" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
            <rect width="4" height="68" rx="2" fill="#F59E0B"/>
            <text x="20" y="28" font-size="14" font-weight="700" fill="#0F172A">Praktikum Jaringan &amp; Cloud</text>
            <text x="20" y="48" font-size="12" font-weight="500" fill="#64748B">13:00 - 15:00 • Lab Jaringan • Ir. Bambang, M.T</text>
