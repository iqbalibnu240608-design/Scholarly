      <text x="36" y="46" font-size="24" font-weight="800" fill="#FFFFFF">Selamat Datang di Portal SteelSchool! 👋</text>
      <text x="36" y="74" font-size="14" font-weight="400" fill="#E0E7FF">
        Akses cepat jadwal belajar harian, riwayat kehadiran gerbang RFID, dan transaksi kantin &amp; kopsis secara real-time.
      </text>

      <!-- Quick Action Pills -->
      <g transform="translate(36, 88)">
        <rect width="150" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.2"/>
        <text x="75" y="18" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Jadwal Hari Ini</text>

        <g transform="translate(162, 0)">
          <rect width="160" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.2"/>
          <text x="80" y="18" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cek Saldo Dompet</text>
