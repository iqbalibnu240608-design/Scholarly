  <!-- ================= TOP HEADER (NexaAdmin Style) ================= -->
  <g id="TopHeader" transform="translate(260, 0)">
    <rect width="1180" height="74" fill="#FFFFFF"/>
    <line x1="0" y1="74" x2="1180" y2="74" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Search Input -->
    <g transform="translate(36, 17)">
      <rect width="360" height="40" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="25" font-size="13" fill="#94A3B8">Cari data civitas, NISN, transaksi...</text>
    </g>

    <!-- Header Right Items -->
    <g transform="translate(860, 22)">
      <!-- Period Badge -->
      <rect width="170" height="32" rx="16" fill="#F1F5F9"/>
      <text x="85" y="20" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Semester Ganjil 2026/2027</text>

