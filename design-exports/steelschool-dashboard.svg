            <text x="562" y="37" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">AKAN DATANG</text>
          </g>
        </g>
      </g>

      <!-- Right: Recent Transactions Widget (w=414, h=580) -->
      <g transform="translate(694, 0)">
        <rect width="414" height="580" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#dashShadow)"/>
        <text x="24" y="36" font-size="16" font-weight="700" fill="#0F172A">Transaksi Dompet Terakhir</text>
        <text x="24" y="56" font-size="12.5" font-weight="400" fill="#64748B">Mutasi belanja Kopsis &amp; Kantin Sehat</text>

        <!-- Transaction Rows -->
        <g transform="translate(24, 80)">
          <!-- Tx 1 -->
          <g transform="translate(0, 0)">
            <circle cx="20" cy="24" r="16" fill="#EFF6FF"/>
            <path d="M16 20 H24 V28 H16 Z" fill="none" stroke="#356DF3" stroke-width="1.8"/>
            <text x="46" y="20" font-size="13" font-weight="700" fill="#0F172A">Kantin Bu Sri (Stand 2)</text>
            <text x="46" y="36" font-size="11" font-weight="500" fill="#64748B">Hari ini, 09:45 WIB • Saldo Kantin</text>
            <text x="366" y="26" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end">- Rp 15.000</text>
          </g>

          <line x1="0" y1="56" x2="366" y2="56" stroke="#F1F5F9" stroke-width="1"/>

          <!-- Tx 2 -->
          <g transform="translate(0, 68)">
            <circle cx="20" cy="24" r="16" fill="#FAF5FF"/>
            <path d="M16 20 H24 V28 H16 Z" fill="none" stroke="#7C3AED" stroke-width="1.8"/>
            <text x="46" y="20" font-size="13" font-weight="700" fill="#0F172A">Koperasi Siswa (Buku &amp; ATK)</text>
            <text x="46" y="36" font-size="11" font-weight="500" fill="#64748B">Kemarin, 14:10 WIB • Saldo Kopsis</text>
            <text x="366" y="26" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end">- Rp 25.000</text>
          </g>

          <line x1="0" y1="124" x2="366" y2="124" stroke="#F1F5F9" stroke-width="1"/>

          <!-- Tx 3 -->
