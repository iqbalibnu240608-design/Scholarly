        <text x="20" y="32" font-size="12.5" font-weight="600" fill="#64748B">Status Tagihan SPP</text>
        <text x="20" y="68" font-size="24" font-weight="800" fill="#059669">Lunas</text>
        <rect x="20" y="80" width="104" height="22" rx="11" fill="#ECFDF5"/>
        <text x="72" y="95" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">November 2026</text>
