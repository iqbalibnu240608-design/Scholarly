            <circle cx="20" cy="24" r="16" fill="#ECFDF5"/>
            <path d="M20 18 V30 M14 24 H26" fill="none" stroke="#059669" stroke-width="2"/>
            <text x="46" y="20" font-size="13" font-weight="700" fill="#0F172A">Top-Up Saldo Siswa (Loket TU)</text>
            <text x="46" y="36" font-size="11" font-weight="500" fill="#64748B">03 Nov 2026 • Petugas Tata Usaha</text>
            <text x="366" y="26" font-size="13" font-weight="700" fill="#059669" text-anchor="end">+ Rp 100.000</text>
