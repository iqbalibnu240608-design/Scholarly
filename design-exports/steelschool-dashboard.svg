<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" style="background:#F1F5F9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#356DF3"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="flowizeHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="dashShadow" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- ================= SIDEBAR (NexaAdmin Style) ================= -->
  <g id="Sidebar" transform="translate(0, 0)">
    <rect width="260" height="1024" fill="#FFFFFF"/>
    <line x1="260" y1="0" x2="260" y2="1024" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Brand -->
    <g transform="translate(24, 28)">
      <rect width="36" height="36" rx="10" fill="#356DF3" fill-opacity="0.1"/>
      <path d="M18 6 L27 10 V19 C27 24 18 29 18 29 C18 29 9 24 9 19 V10 Z" fill="none" stroke="#356DF3" stroke-width="2"/>
      <text x="46" y="18" font-size="18" font-weight="800" fill="#0F172A">SteelSchool</text>
      <text x="46" y="32" font-size="10.5" font-weight="600" fill="#94A3B8">PORTAL OPERASIONAL</text>
    </g>

    <line x1="24" y1="88" x2="236" y2="88" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Menu Items -->
    <g transform="translate(16, 110)">
      <!-- Item 1: Dashboard (Active) -->
      <g transform="translate(0, 0)">
        <rect width="228" height="44" rx="12" fill="#EFF6FF"/>
        <circle cx="26" cy="22" r="8" fill="#356DF3"/>
        <text x="46" y="27" font-size="13.5" font-weight="700" fill="#356DF3">Dashboard Ringkasan</text>
      </g>

      <!-- Item 2: Civitas Sekolah -->
      <g transform="translate(0, 52)">
        <text x="46" y="27" font-size="13.5" font-weight="500" fill="#64748B">Civitas &amp; Rombel</text>
      </g>

      <!-- Item 3: Presensi Gerbang -->
      <g transform="translate(0, 104)">
        <text x="46" y="27" font-size="13.5" font-weight="500" fill="#64748B">Presensi RFID Gerbang</text>
      </g>

      <!-- Item 4: Kopsis Smart POS -->
      <g transform="translate(0, 156)">
        <text x="46" y="27" font-size="13.5" font-weight="500" fill="#64748B">Kopsis Smart POS</text>
      </g>

      <!-- Item 5: Kantin Sehat -->
      <g transform="translate(0, 208)">
        <text x="46" y="27" font-size="13.5" font-weight="500" fill="#64748B">Kantin Sehat Cashless</text>
      </g>

      <!-- Item 6: Pembayaran SPP -->
      <g transform="translate(0, 260)">
        <text x="46" y="27" font-size="13.5" font-weight="500" fill="#64748B">Pembayaran SPP Digital</text>
      </g>

      <!-- Item 7: Pengaturan -->
      <g transform="translate(0, 312)">
        <text x="46" y="27" font-size="13.5" font-weight="500" fill="#64748B">Pengaturan &amp; Audit Log</text>
      </g>
    </g>

    <!-- Bottom User Profile Card -->
    <g transform="translate(16, 936)">
      <rect width="228" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="34" cy="32" r="18" fill="#356DF3"/>
      <text x="34" y="37" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">AP</text>
      <text x="62" y="26" font-size="13" font-weight="700" fill="#0F172A">Ahmad Pratama</text>
      <text x="62" y="44" font-size="11" font-weight="500" fill="#64748B">Siswa • XII RPL 1</text>
    </g>
